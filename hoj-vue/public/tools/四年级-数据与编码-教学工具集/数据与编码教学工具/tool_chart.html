<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据图表生成器 · 数据与编码</title>
<style>
:root{
  --c-red:#e53935;
  --c-red-dark:#c62828;
  --c-red-light:#ffebee;
  --c-bg:#fffafa;
  --c-text:#3e2723;
  --c-muted:#795548;
  --c-border:#ffcdd2;
  --c-blue:#1e88e5;
  --c-green:#43a047;
  --c-orange:#fb8c00;
  --c-purple:#8e24aa;
  --c-teal:#00897b;
  --c-pink:#ec407a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--c-bg);
  color:var(--c-text);
  min-height:100vh;
  padding:20px;
  line-height:1.6;
}
.container{max-width:1200px;margin:0 auto}
.back-link{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--c-red-dark);text-decoration:none;
  font-size:14px;margin-bottom:16px;
  padding:6px 14px;background:#fff;border-radius:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
  transition:all .2s;
}
.back-link:hover{transform:translateX(-3px)}
header{
  background:linear-gradient(135deg,var(--c-red) 0%,#d81b60 100%);
  color:#fff;padding:30px 28px;border-radius:18px;
  margin-bottom:22px;
  box-shadow:0 8px 24px rgba(229,57,53,0.25);
}
.lesson-tag{
  display:inline-block;background:rgba(255,255,255,0.25);
  padding:4px 12px;border-radius:12px;
  font-size:12px;margin-bottom:8px;
}
header h1{font-size:26px;margin-bottom:6px}
header p{font-size:14px;opacity:0.92}

.tabs{
  display:flex;gap:6px;margin-bottom:18px;
  background:#fff;padding:6px;border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  overflow-x:auto;
}
.tab{
  flex:1;min-width:90px;
  padding:12px 16px;
  border:none;background:transparent;
  color:var(--c-muted);font-size:14px;
  font-weight:bold;cursor:pointer;
  border-radius:8px;
  transition:all .2s;
  font-family:inherit;
  white-space:nowrap;
}
.tab:hover{background:var(--c-red-light)}
.tab.active{
  background:var(--c-red);color:#fff;
}

.layout{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:18px;
}
.card{
  background:#fff;border-radius:14px;padding:22px;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
  border:1px solid var(--c-border);
}
.card h2{
  font-size:16px;color:var(--c-red-dark);
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--c-red-light);
}

.data-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:14px;
  font-size:13px;
}
.data-table th{
  background:var(--c-red-light);
  color:var(--c-red-dark);
  padding:8px;font-weight:bold;
  font-size:12px;
  border:1px solid var(--c-border);
}
.data-table td{
  padding:4px;
  border:1px solid var(--c-border);
}
.data-table input{
  width:100%;padding:6px 8px;
  border:1px solid transparent;
  background:transparent;
  font-size:13px;
  font-family:inherit;
  color:var(--c-text);
}
.data-table input:focus{
  outline:none;
  border-color:var(--c-red);
  background:#fffde7;
  border-radius:4px;
}
.data-table input[type="number"]{
  text-align:right;
  font-family:"Courier New",monospace;
}
.data-table .del-btn{
  width:24px;height:24px;
  border:none;border-radius:50%;
  background:#ef5350;color:#fff;
  cursor:pointer;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto;
}
.data-table .del-btn:hover{background:#c62828}

.btn{
  padding:10px 16px;
  border:none;border-radius:8px;
  font-size:13px;font-weight:bold;
  cursor:pointer;transition:all .2s;
  font-family:inherit;
}
.btn-primary{
  background:var(--c-red);color:#fff;
}
.btn-primary:hover{background:var(--c-red-dark);transform:translateY(-2px)}
.btn-secondary{
  background:#fff;color:var(--c-red-dark);
  border:2px solid var(--c-border);
}
.btn-secondary:hover{background:var(--c-red-light)}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn-row .btn{flex:1;min-width:80px}

.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.preset-btn{
  padding:6px 12px;font-size:12px;
  background:var(--c-red-light);color:var(--c-red-dark);
  border:1px solid var(--c-border);border-radius:14px;
  cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.preset-btn:hover{background:var(--c-red);color:#fff}

.title-input{
  width:100%;padding:10px 12px;
  border:2px solid var(--c-border);
  border-radius:8px;font-size:14px;
  margin-bottom:10px;
  font-family:inherit;
}
.title-input:focus{outline:none;border-color:var(--c-red)}

.chart-container{
  display:flex;flex-direction:column;align-items:center;
  min-height:480px;
  position:relative;
}
.chart-title{
  font-size:18px;font-weight:bold;
  color:var(--c-text);
  margin-bottom:14px;
  text-align:center;
}
#chartSvg{
  max-width:100%;
  height:auto;
}

.legend-list{
  display:flex;flex-wrap:wrap;
  gap:10px 18px;justify-content:center;
  margin-top:14px;font-size:13px;
}
.legend-item{
  display:flex;align-items:center;gap:6px;
  color:var(--c-text);
}
.legend-color{
  width:14px;height:14px;border-radius:3px;
}

.theory{
  background:linear-gradient(135deg,#fff8e1 0%,#ffecb3 100%);
  border-left:4px solid #ffa726;
  padding:14px 18px;border-radius:8px;
  margin-top:18px;font-size:13px;line-height:1.7;
  color:#5d4037;
}
.theory h3{
  color:#e65100;margin-bottom:6px;
  font-size:14px;
}
.theory ul{padding-left:20px;margin-top:6px}
.theory li{margin-bottom:4px}

@media (max-width:880px){
  .layout{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← 返回工具首页</a>

  <header>
    <span class="lesson-tag">第21-23课 · 用图表表达数据</span>
    <h1>📊 数据图表生成器</h1>
    <p>把枯燥的数字变成漂亮的图表！柱形图、饼图、折线图、雷达图任你选！</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-type="bar">📊 柱形图</button>
    <button class="tab" data-type="pie">🥧 饼图</button>
    <button class="tab" data-type="line">📈 折线图</button>
    <button class="tab" data-type="radar">🕸️ 雷达图</button>
  </div>

  <div class="layout">
    <div class="card">
      <h2>📝 数据输入</h2>
      
      <input type="text" class="title-input" id="chartTitle" placeholder="图表标题">
      
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:50%">名称</th>
            <th style="width:35%">数值</th>
            <th style="width:15%">操作</th>
          </tr>
        </thead>
        <tbody id="dataBody"></tbody>
      </table>
      
      <div class="btn-row">
        <button class="btn btn-secondary" id="addRowBtn">+ 添加一行</button>
        <button class="btn btn-primary" id="renderBtn">🎨 生成图表</button>
      </div>
      
      <h2 style="margin-top:14px">📋 示例数据</h2>
      <div class="preset-row">
        <button class="preset-btn" data-preset="fruit">水果销量</button>
        <button class="preset-btn" data-preset="weather">每月温度</button>
        <button class="preset-btn" data-preset="subjects">学科成绩</button>
        <button class="preset-btn" data-preset="time">每日时间</button>
        <button class="preset-btn" data-preset="games">游戏排行</button>
      </div>

      <div class="theory">
        <h3>💡 选哪种图表？</h3>
        <ul>
          <li><b>柱形图</b>：比较不同事物的多少（如各班人数）</li>
          <li><b>饼图</b>：看每部分占整体的比例（如时间分配）</li>
          <li><b>折线图</b>：看数据随时间的变化（如气温变化）</li>
          <li><b>雷达图</b>：综合比较多个方面的能力</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h2>🎨 图表预览</h2>
      <div class="chart-container">
        <div class="chart-title" id="displayTitle"></div>
        <svg id="chartSvg" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend-list" id="legendList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS = ['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00897b','#ec407a','#7cb342','#039be5','#f4511e','#5e35b1','#00acc1'];

const PRESETS = {
  fruit:{title:'四(1)班水果销量调查',data:[
    {name:'苹果',value:25},{name:'香蕉',value:18},{name:'橙子',value:15},
    {name:'葡萄',value:22},{name:'西瓜',value:12}
  ]},
  weather:{title:'2024年每月平均气温(℃)',data:[
    {name:'1月',value:5},{name:'2月',value:8},{name:'3月',value:13},
    {name:'4月',value:19},{name:'5月',value:24},{name:'6月',value:28},
    {name:'7月',value:31},{name:'8月',value:30},{name:'9月',value:25},
    {name:'10月',value:19},{name:'11月',value:12},{name:'12月',value:7}
  ]},
  subjects:{title:'小明的期末成绩',data:[
    {name:'语文',value:92},{name:'数学',value:88},{name:'英语',value:85},
    {name:'科学',value:90},{name:'信息',value:95}
  ]},
  time:{title:'我的一天24小时',data:[
    {name:'睡觉',value:9},{name:'上学',value:7},{name:'吃饭',value:2},
    {name:'写作业',value:2},{name:'娱乐',value:3},{name:'其他',value:1}
  ]},
  games:{title:'游戏室器材数量',data:[
    {name:'乒乓球拍',value:30},{name:'羽毛球拍',value:24},{name:'篮球',value:18},
    {name:'足球',value:12},{name:'跳绳',value:40}
  ]}
};

let currentType = 'bar';
let chartData = [];
let chartTitle = '';

const dataBody = document.getElementById('dataBody');
const titleInput = document.getElementById('chartTitle');
const displayTitle = document.getElementById('displayTitle');
const chartSvg = document.getElementById('chartSvg');
const legendList = document.getElementById('legendList');

function renderTable(){
  dataBody.innerHTML = '';
  chartData.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(item.name)}" data-idx="${idx}" data-field="name"></td>
      <td><input type="number" value="${item.value}" data-idx="${idx}" data-field="value" step="0.1"></td>
      <td><button class="del-btn" data-idx="${idx}">×</button></td>
    `;
    dataBody.appendChild(tr);
  });
  
  dataBody.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx);
      const field = e.target.dataset.field;
      if(field === 'value'){
        chartData[idx].value = parseFloat(e.target.value) || 0;
      } else {
        chartData[idx].name = e.target.value;
      }
    });
  });
  
  dataBody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.idx);
      chartData.splice(idx, 1);
      renderTable();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function loadPreset(key){
  const p = PRESETS[key];
  chartData = p.data.map(d => ({...d}));
  chartTitle = p.title;
  titleInput.value = p.title;
  renderTable();
  render();
}

function addRow(){
  chartData.push({name:'新项目', value:10});
  renderTable();
}

function render(){
  chartTitle = titleInput.value || '我的图表';
  displayTitle.textContent = chartTitle;
  legendList.innerHTML = '';
  
  if(chartData.length === 0){
    chartSvg.innerHTML = '<text x="300" y="240" text-anchor="middle" fill="#999" font-size="16">没有数据</text>';
    return;
  }
  
  if(currentType === 'bar') renderBar();
  else if(currentType === 'pie') renderPie();
  else if(currentType === 'line') renderLine();
  else if(currentType === 'radar') renderRadar();
}

function renderBar(){
  const W = 600, H = 480;
  const padL = 60, padR = 30, padT = 30, padB = 70;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  
  const max = Math.max(...chartData.map(d => d.value), 0);
  const min = Math.min(...chartData.map(d => d.value), 0);
  const range = max - min || 1;
  // 取个整数刻度
  const niceMax = Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max||1)))) * Math.pow(10, Math.floor(Math.log10(max||1)));
  const yMax = max <= 0 ? 10 : (max <= 10 ? Math.ceil(max) : Math.ceil(max/5)*5);
  const yMin = min >= 0 ? 0 : Math.floor(min/5)*5;
  
  let svg = '';
  
  // Y轴刻度线
  const ticks = 5;
  for(let i = 0; i <= ticks; i++){
    const v = yMin + (yMax - yMin) * i / ticks;
    const y = padT + chartH - chartH * (v - yMin) / (yMax - yMin);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e0e0e0" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#666">${v.toFixed(v % 1 === 0 ? 0 : 1)}</text>`;
  }
  
  // 坐标轴
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+chartH}" stroke="#333" stroke-width="2"/>`;
  svg += `<line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="#333" stroke-width="2"/>`;
  
  // 柱子
  const n = chartData.length;
  const barW = chartW / n * 0.65;
  const gap = chartW / n;
  
  chartData.forEach((d, i) => {
    const x = padL + gap * i + (gap - barW) / 2;
    const h = chartH * (d.value - yMin) / (yMax - yMin);
    const y = padT + chartH - h;
    const color = COLORS[i % COLORS.length];
    
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="3">
      <animate attributeName="height" from="0" to="${h}" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="${padT+chartH}" to="${y}" dur="0.5s" fill="freeze"/>
    </rect>`;
    
    // 数值标签
    svg += `<text x="${x + barW/2}" y="${y - 5}" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">${d.value}</text>`;
    
    // X轴标签
    const labelX = x + barW/2;
    const labelY = padT + chartH + 18;
    if(d.name.length > 4){
      svg += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-30 ${labelX} ${labelY})">${escapeHtml(d.name)}</text>`;
    } else {
      svg += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="12" fill="#333">${escapeHtml(d.name)}</text>`;
    }
  });
  
  chartSvg.innerHTML = svg;
}

function renderPie(){
  const W = 600, H = 480;
  const cx = W/2, cy = H/2 - 10;
  const r = 150;
  
  const total = chartData.reduce((s,d) => s + Math.max(0, d.value), 0);
  if(total === 0){
    chartSvg.innerHTML = '<text x="300" y="240" text-anchor="middle" fill="#999" font-size="16">数据总和为0</text>';
    return;
  }
  
  let svg = '';
  let startAngle = -Math.PI / 2;
  
  chartData.forEach((d, i) => {
    if(d.value <= 0) return;
    const angle = (d.value / total) * Math.PI * 2;
    const endAngle = startAngle + angle;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const color = COLORS[i % COLORS.length];
    
    const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    svg += `<path d="${path}" fill="${color}" stroke="#fff" stroke-width="2">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="${i*0.05}s" fill="freeze"/>
    </path>`;
    
    // 标签
    const midAngle = startAngle + angle/2;
    const labelR = r * 0.65;
    const lx = cx + labelR * Math.cos(midAngle);
    const ly = cy + labelR * Math.sin(midAngle);
    const pct = (d.value/total*100).toFixed(1);
    if(angle > 0.2){
      svg += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">${pct}%</text>`;
    }
    
    // 外部标签
    const outR = r + 20;
    const ox = cx + outR * Math.cos(midAngle);
    const oy = cy + outR * Math.sin(midAngle);
    if(angle > 0.15){
      const anchor = Math.cos(midAngle) > 0.1 ? 'start' : (Math.cos(midAngle) < -0.1 ? 'end' : 'middle');
      svg += `<text x="${ox}" y="${oy}" text-anchor="${anchor}" font-size="12" fill="#333">${escapeHtml(d.name)}</text>`;
    }
    
    startAngle = endAngle;
  });
  
  chartSvg.innerHTML = svg;
  
  // 图例
  legendList.innerHTML = chartData.map((d, i) => 
    `<div class="legend-item"><span class="legend-color" style="background:${COLORS[i % COLORS.length]}"></span>${escapeHtml(d.name)}: ${d.value}</div>`
  ).join('');
}

function renderLine(){
  const W = 600, H = 480;
  const padL = 60, padR = 30, padT = 30, padB = 70;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  
  const max = Math.max(...chartData.map(d => d.value), 0);
  const min = Math.min(...chartData.map(d => d.value), 0);
  const yMax = max <= 0 ? 10 : (max <= 10 ? Math.ceil(max) : Math.ceil(max/5)*5);
  const yMin = min >= 0 ? 0 : Math.floor(min/5)*5;
  
  let svg = '';
  
  // 网格
  const ticks = 5;
  for(let i = 0; i <= ticks; i++){
    const v = yMin + (yMax - yMin) * i / ticks;
    const y = padT + chartH - chartH * (v - yMin) / (yMax - yMin);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e0e0e0" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#666">${v.toFixed(v % 1 === 0 ? 0 : 1)}</text>`;
  }
  
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+chartH}" stroke="#333" stroke-width="2"/>`;
  svg += `<line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="#333" stroke-width="2"/>`;
  
  const n = chartData.length;
  const stepX = n > 1 ? chartW / (n - 1) : 0;
  
  // 折线路径
  let pathD = '';
  const points = [];
  chartData.forEach((d, i) => {
    const x = padL + stepX * i;
    const h = chartH * (d.value - yMin) / (yMax - yMin);
    const y = padT + chartH - h;
    points.push({x, y, value:d.value, name:d.name});
    pathD += (i === 0 ? 'M' : 'L') + ` ${x} ${y} `;
  });
  
  svg += `<path d="${pathD}" fill="none" stroke="${COLORS[0]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" from="0,2000" to="2000,0" dur="1s" fill="freeze"/>
  </path>`;
  
  // 数据点
  points.forEach((p, i) => {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#fff" stroke="${COLORS[0]}" stroke-width="3">
      <animate attributeName="r" from="0" to="5" dur="0.3s" begin="${i*0.05}s" fill="freeze"/>
    </circle>`;
    svg += `<text x="${p.x}" y="${p.y - 12}" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">${p.value}</text>`;
    
    // X轴标签
    const labelX = p.x;
    const labelY = padT + chartH + 18;
    if(p.name.length > 3){
      svg += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-30 ${labelX} ${labelY})">${escapeHtml(p.name)}</text>`;
    } else {
      svg += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="12" fill="#333">${escapeHtml(p.name)}</text>`;
    }
  });
  
  chartSvg.innerHTML = svg;
}

function renderRadar(){
  const W = 600, H = 480;
  const cx = W/2, cy = H/2;
  const r = 150;
  
  const n = chartData.length;
  if(n < 3){
    chartSvg.innerHTML = '<text x="300" y="240" text-anchor="middle" fill="#999" font-size="16">雷达图至少需要3个数据点</text>';
    return;
  }
  
  const max = Math.max(...chartData.map(d => d.value), 1);
  const yMax = max <= 10 ? Math.ceil(max) : Math.ceil(max/10)*10;
  
  let svg = '';
  
  // 多边形网格
  for(let level = 1; level <= 5; level++){
    const lr = r * level / 5;
    let pts = '';
    for(let i = 0; i < n; i++){
      const angle = -Math.PI/2 + (Math.PI*2 * i / n);
      const x = cx + lr * Math.cos(angle);
      const y = cy + lr * Math.sin(angle);
      pts += `${x},${y} `;
    }
    svg += `<polygon points="${pts}" fill="none" stroke="#e0e0e0" stroke-width="1"/>`;
  }
  
  // 轴线
  for(let i = 0; i < n; i++){
    const angle = -Math.PI/2 + (Math.PI*2 * i / n);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#bbb" stroke-width="1"/>`;
    
    // 标签
    const lr = r + 25;
    const lx = cx + lr * Math.cos(angle);
    const ly = cy + lr * Math.sin(angle);
    const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : (Math.cos(angle) > 0 ? 'start' : 'end');
    svg += `<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="13" fill="#333" font-weight="bold">${escapeHtml(chartData[i].name)}</text>`;
  }
  
  // 数据多边形
  let dataPts = '';
  const dataPoints = [];
  chartData.forEach((d, i) => {
    const angle = -Math.PI/2 + (Math.PI*2 * i / n);
    const dr = r * (Math.max(0, d.value) / yMax);
    const x = cx + dr * Math.cos(angle);
    const y = cy + dr * Math.sin(angle);
    dataPts += `${x},${y} `;
    dataPoints.push({x, y, value:d.value});
  });
  
  svg += `<polygon points="${dataPts}" fill="${COLORS[0]}" fill-opacity="0.35" stroke="${COLORS[0]}" stroke-width="2.5">
    <animate attributeName="fill-opacity" from="0" to="0.35" dur="0.6s" fill="freeze"/>
  </polygon>`;
  
  // 数据点
  dataPoints.forEach((p, i) => {
    svg += `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${COLORS[0]}" stroke="#fff" stroke-width="2">
      <animate attributeName="r" from="0" to="5" dur="0.4s" begin="${i*0.06}s" fill="freeze"/>
    </circle>`;
    svg += `<text x="${p.x}" y="${p.y - 10}" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">${p.value}</text>`;
  });
  
  // 中心刻度
  svg += `<text x="${cx-4}" y="${cy+4}" text-anchor="end" font-size="10" fill="#999">0</text>`;
  svg += `<text x="${cx-4}" y="${cy-r+4}" text-anchor="end" font-size="10" fill="#999">${yMax}</text>`;
  
  chartSvg.innerHTML = svg;
}

// 事件
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentType = tab.dataset.type;
    render();
  });
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => loadPreset(btn.dataset.preset));
});

document.getElementById('addRowBtn').addEventListener('click', addRow);
document.getElementById('renderBtn').addEventListener('click', render);
titleInput.addEventListener('input', () => {
  chartTitle = titleInput.value;
  displayTitle.textContent = chartTitle || '我的图表';
});

// 初始化
loadPreset('fruit');
</script>
</body>
</html>
